[package]
org = "zed-pkg"
name = "zed-orm-core"
version = "0.2.0"
description = "Private backend-only Diesel and SeaORM boundary for zed-pkg"

[package.repository]
vcs = "git"
url = "https://github.com/zed-pkg/zed-orm-core"

[dependencies]
"zed-pkg/zed-interfaces" = "^0.1.0"
"zed-pkg/zed-lib-core" = "^0.2.0"

[publish]
include_readme = true
tag_format = "v{version}"
exclude = [
  ".env",
  ".env.*",
  "env/dec/**",
  ".vendor/.zed/**",
  ".zed/**",
  ".zed-pack/**",
  "target/**",
  "**/target/**",
  "**/node_modules/**",
  "**/.dart_tool/**",
  "**/*.log",
]

[install]
dir = ".vendor/.zed"

[targets.rust]
dir = "."
adapter = "rust"

[scripts]
format = "cargo fmt --all -- --check"
lint = "cargo clippy --all-targets --all-features -- -D warnings"
test-default = "cargo test --all-targets"
test-read-write = "cargo test --all-targets --all-features"
test-doc = "cargo test --doc"
